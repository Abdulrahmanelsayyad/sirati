name: Sirati E2E QA

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify PDF order security SQL (static only)
        run: python3 qa/pdf_order_policy_static_check.py

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Reconstruct and prepare source
        run: |
          cat source.part1 source.part2 source.part3 source.part4a source.part4b source.part4c source.part5 source.part6 source.part7 | base64 -d > /tmp/sirati.zip
          rm -rf site-src
          mkdir site-src
          unzip -q /tmp/sirati.zip -d site-src
          python .github/scripts/prepare_pages.py site-src/sirati-cv-source

      - name: Check account draft isolation
        run: python qa/account_storage_check.py site-src/sirati-cv-source

      - name: Check duplicate CV safety
        run: python qa/multi_cv_duplicate_check.py site-src/sirati-cv-source

      - name: Install and build
        working-directory: site-src/sirati-cv-source
        env:
          NEXT_PUBLIC_BASE_PATH: /sirati
        run: |
          npm install
          npm run build
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve static build
        run: |
          mkdir -p qa-root
          ln -s "$GITHUB_WORKSPACE/site-src/sirati-cv-source/out" qa-root/sirati
          python3 -m http.server 4173 --directory qa-root >/tmp/sirati-qa-server.log 2>&1 &
          echo $! > /tmp/sirati-qa-server.pid
          sleep 2
          curl --fail http://127.0.0.1:4173/sirati/templates/ >/dev/null

      - name: Run E2E QA
        working-directory: site-src/sirati-cv-source
        run: |
          cp "$GITHUB_WORKSPACE/qa/e2e.mjs" ./qa-e2e.mjs
          node ./qa-e2e.mjs

      - name: Upload QA PDFs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sirati-qa-debug
          path: |
            /tmp/sirati-qa-pdfs
            /tmp/sirati-qa-server.log
          if-no-files-found: ignore

      - name: Upload Profile Sidebar visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-sidebar-visual-qa
          path: /tmp/sirati-qa-pdfs/profile-sidebar-*.png
          if-no-files-found: ignore
