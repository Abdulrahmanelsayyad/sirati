name: Deploy Sirati to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Sirati source
        run: |
          cat source.part1 source.part2 source.part3 | base64 -d > /tmp/sirati.zip
          mkdir -p buildsrc
          unzip -q /tmp/sirati.zip -d buildsrc

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: buildsrc/sirati-cv-source/package-lock.json

      - name: Install dependencies
        working-directory: buildsrc/sirati-cv-source
        run: npm ci

      - name: Configure GitHub Pages base path
        working-directory: buildsrc/sirati-cv-source
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'next.config.ts';
          let s = fs.readFileSync(path, 'utf8');
          s = s.replace(
            'const nextConfig: NextConfig = {',
            'const nextConfig: NextConfig = {\n  basePath: "/sirati-cv",\n  assetPrefix: "/sirati-cv/",'
          );
          fs.writeFileSync(path, s);
          NODE

      - name: Build static site
        working-directory: buildsrc/sirati-cv-source
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://hzzojoiqzbeivxesjlyf.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_eHoILJwdvPp-F4WoLFm05g_hoj8hNDP
        run: npm run build

      - name: Disable Jekyll
        run: touch buildsrc/sirati-cv-source/out/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: buildsrc/sirati-cv-source/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
