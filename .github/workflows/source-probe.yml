name: Source Probe

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Reconstruct source
        run: |
          cat source.part1 source.part2 source.part3 source.part4a source.part4b source.part4c source.part5 source.part6 source.part7 | base64 -d > /tmp/sirati.zip
          rm -rf site-src
          mkdir site-src
          unzip -q /tmp/sirati.zip -d site-src
      - name: Show local draft logic
        run: |
          nl -ba site-src/sirati-cv-source/app/builder/page.tsx | sed -n '155,255p'
